<ds-home-news></ds-home-news>
<ds-configuration-search-page *ngIf="showDiscoverFilters"
                              [sideBarWidth]="3"
                              [showViewModes]="false"
                              [searchEnabled]="false"
                              [inPlaceSearch]="false"
                              [showScopeSelector]="false">
  <ng-container searchContentTop *ngTemplateOutlet="homeContent"></ng-container>
</ds-configuration-search-page>
<div *ngIf="!showDiscoverFilters" class="container">
  <ng-container *ngTemplateOutlet="homeContent"></ng-container>
</div>
<ds-suggestions-popup></ds-suggestions-popup>

<ng-template #homeContent>
  <ng-container *ngIf="(site$ | async) as site">
    <ds-view-tracker [object]="site"></ds-view-tracker>
  </ng-container>

  <div class="destacado">
    <div class="explorar-title-container">
      <h2 class="explorar-title">Explorar</h2>
      <p class="explorar-subtitle">PRODUCCIÓN DE LA <b>UNLP</b></p>
    </div>
    <div class="row">
      <div *ngFor="let item of exploraciones" class="col-6 col-md-3 mb-4">
        <a [routerLink]="item.href" [queryParams]="item.queryParams || {}">
          <div class="collection-card">
            <div class="icon-container">
              <img [src]="item.img" alt="{{item.title}}">
            </div>
            <div class="text-container">
              <h4>{{item.title}}</h4>
              <p>{{item.description}}</p>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>
</ng-template>

<ng-container *ngTemplateOutlet="itemsGrid; context: { title: 'COLECCIONES DESTACADAS', items: coleccionesDestacadas, column: false }"></ng-container>
<ng-container *ngTemplateOutlet="itemsGrid; context: { title: 'UNIDADES ACADÉMICAS' }"></ng-container>
<ng-container *ngTemplateOutlet="itemsGrid; context: { subtitle: 'FACULTADES', items: facultadesComunidades, column: true }"></ng-container>
<ng-container *ngTemplateOutlet="itemsGrid; context: { subtitle: 'PREGRADO', items: pregradoComunidades, column: true }"></ng-container>
<ng-container *ngTemplateOutlet="itemsGrid; context: { subtitle: 'PRESIDENCIA', items: presidenciaComunidades, column: true }"></ng-container>

<ng-template #itemsGrid let-title="title" let-subtitle="subtitle" let-items="items" let-column="column">
  <div class="section-destacados">
    <h2 *ngIf="title" class="section-title">{{title}}</h2>
    <h5 *ngIf="subtitle" class="section-subtitle">{{subtitle}}</h5>
    <div *ngIf="items" class="section-grid container" [ngClass]="{'d-inline d-sm-flex': column}">
      <div *ngFor="let item of items" class="section-item">
        <a [href]="item.href">
          <div class="img-container">
            <img [src]="item.img" [alt]="item.title">
          </div>
          <div class="section-texto">
            <p>{{item.description || item.title}}</p>
          </div>
        </a>
      </div>
    </div>
  </div>
</ng-template>

<div class="help text-center d-flex flex-column flex-md-row justify-content-around align-items-center">
  <div class="p-2 bd-highlight">
    <i class="fa-solid fa-circle-info"></i>
    <h5>Ayuda para investigadores</h5>
  </div>
  <div class="p-2 bd-highlight">
    <i class="fa-solid fa-scale-balanced"></i>
    <h5>Obligación de depósito en el repositorio</h5>
  </div>
  <div class="p-2 bd-highlight">
    <i class="fa-solid fa-chart-simple"></i>
    <h5>Estadísticas de crecimiento</h5>
  </div>
</div>

<div class="aliados-section align-items-center d-none d-md-flex">
  <div class="aliados-title d-flex align-items-center justify-content-end">
    <div>
      <h2>Aliados</h2>
    </div>
  </div>
  <div class="aliados-logos">
    <a href="https://repositoriosdigitales.mincyt.gob.ar/vufind/" target="_blank">
      <img src="assets/custom/images/SNRD.png" alt="SNRD Logo">
    </a>
    <a href="https://www.lareferencia.info/es/" target="_blank">
      <img src="assets/custom/images/La referencia.png" alt="La Referencia Logo">
    </a>
    <a href="https://coar-repositories.org/" target="_blank">
      <img src="assets/custom/images/COAR.png" alt="COAR Logo">
    </a>
  </div>
</div>
