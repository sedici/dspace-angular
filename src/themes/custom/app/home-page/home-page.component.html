<ds-home-news></ds-home-news>
<ds-configuration-search-page *ngIf="showDiscoverFilters"
                              [sideBarWidth]="3"
                              [showViewModes]="false"
                              [searchEnabled]="false"
                              [inPlaceSearch]="false"
                              [showScopeSelector]="false">
  <ng-container searchContentTop *ngTemplateOutlet="homeContent"></ng-container>
</ds-configuration-search-page>
<div *ngIf="!showDiscoverFilters" class="container">
  <ng-container *ngTemplateOutlet="homeContent"></ng-container>
</div>
<ds-suggestions-popup></ds-suggestions-popup>

<ng-template #homeContent>
  <ng-container *ngIf="(site$ | async) as site">
    <ds-view-tracker [object]="site"></ds-view-tracker>
  </ng-container>

  <div class="destacado">
    <div class="explorar-title-container">
      <h2 class="explorar-title">Explorar</h2>
      <p class="explorar-subtitle">PRODUCCIÓN DE LA <b>UNLP</b></p>
    </div>
    <div class="row">
      <div *ngFor="let item of colecciones" class="col-6 col-md-3 mb-4">
        <div class="collection-card">
          <div class="icon-container">
            <img [src]="item.img" alt="{{item.title}}">
          </div>
          <div class="text-container">
            <h4>{{item.title}}</h4>
            <p>{{item.description}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>

<ng-container *ngTemplateOutlet="itemsGrid; context: { title: 'COLECCIONES DESTACADAS', items: coleccionesDestacadas, column: false, isSingleRow: true }"></ng-container>
<ng-container *ngTemplateOutlet="itemsGrid; context: { title: 'UNIDADES ACADÉMICAS', items: unidadesAcademicas, column: true, isSingleRow: false }"></ng-container>

<ng-template #itemsGrid let-title="title" let-items="items" let-column="column" let-isSingleRow="isSingleRow">
  <div class="section-destacados">
    <h2 class="section-title">{{title}}</h2>
    <div class="section-grid container" [ngClass]="{'d-inline d-sm-flex': column}">
      <div *ngFor="let item of items" class="section-item" [ngClass]="isSingleRow ? 'single-row' : 'multi-row'">
        <a [href]="item.href">
          <div class="img-container">
            <img [src]="item.img" [alt]="item.title">
          </div>
          <div class="section-texto">
            <p>{{item.description || item.title}}</p>
          </div>
        </a>
      </div>
    </div>
  </div>
</ng-template>

<div class="help text-center d-flex flex-column flex-md-row justify-content-around align-items-center">
  <div class="p-2 bd-highlight">
    <i class="fa-solid fa-circle-info"></i>
    <h5>Ayuda para investigadores</h5>
  </div>
  <div class="p-2 bd-highlight">
    <i class="fa-solid fa-scale-balanced"></i>
    <h5>Obligación de depósito en el repositorio</h5>
  </div>
  <div class="p-2 bd-highlight">
    <i class="fa-solid fa-chart-simple"></i>
    <h5>Estadísticas de crecimiento</h5>
  </div>
</div>

<div class="aliados-section align-items-center d-none d-md-flex">
  <div class="aliados-title d-flex align-items-center justify-content-end">
    <div>
      <h2>Aliados</h2>
    </div>
  </div>
  <div class="aliados-logos">
    <img src="ruta/a/snr-logo.png" alt="SNRD Logo">
    <img src="ruta/a/la-referencia-logo.png" alt="La Referencia Logo">
    <img src="ruta/a/coar-logo.png" alt="COAR Logo">
  </div>
</div>
