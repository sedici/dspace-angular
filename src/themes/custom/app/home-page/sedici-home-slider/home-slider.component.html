<div class="destacado">
  <p class="main-tittle">{{title}}</p>
  <div *ngIf="slide == false" class="row">
    <div *ngFor="let item of items" class="section">
      <img [src]="item.img" alt="">
      <div class="text-container">
        <h4><b>{{item.title}}</b></h4>
        <p>{{item.description}}</p>
      </div>
    </div>
  </div>
  <div id="pruebas" class="carousel slide" data-ride="carousel" *ngIf="slide == true">
    <!--<ol class="carousel-indicators">
      <li *ngFor="let item of [nItems].constructor(); let i = index" data-slide-to="i" [ngClass]="{'active': i == 0}"></li>
    </ol>-->
    <div class="carousel-inner">
      <div *ngFor="let slide of sliderItems; let i = index" class="carousel-item" [ngClass]="{'active': i == 0}">
        <div class="row">
          <div *ngFor="let item of slide" class="col">
            <div class="image-container">
              <img *ngIf="prueba==false" class="d-block w-100" [src]="item.img" alt="Primera imagen">
              <ds-comcol-page-logo *ngIf="prueba"
                                  [logo]="(item.img | async)?.payload"
                                  [alternateText]="'collection.logo' | translate">
              </ds-comcol-page-logo>
            </div>
            <div class="text-container">
              <h4><b><a [routerLink]="item.href">{{item.title}}</a></b></h4>
              <p>{{item.description}}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <a class="carousel-control-prev" href="#pruebas" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
    </a>
    <a class="carousel-control-next" href="#pruebas" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
    </a>
  </div>
</div>
