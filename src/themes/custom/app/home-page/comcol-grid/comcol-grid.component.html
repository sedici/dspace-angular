<ng-container *ngTemplateOutlet="itemsGrid; context: { title: 'featuredCollections', items: coleccionesDestacadas }"></ng-container>
<div id="faculties-section">
  <ng-container *ngTemplateOutlet="itemsGridCards; context: { title: 'faculties', items: facultades }"></ng-container>
</div>
<ng-container *ngTemplateOutlet="itemsGridCards; context: { title: 'undergraduate', items: pregrado }"></ng-container>

<ng-template #itemsGrid let-title="title" let-items="items">
  <div class="section-destacados simple-grid">
    <div class="title-container">
      <span class="explorar-text">{{'home.page.explore' | translate}}</span>
      <h2 class="section-title">{{'home.page.' + title | translate}}</h2>
    </div>
    @if (items) {
      <div class="section-grid container single-row-scroll">
        @for (item of items; track item) {
          <div class="section-item single-row">
            <a [href]="item.href">
              <div class="img-container">
                <img [src]="item.img" [alt]="item.title">
              </div>
            </a>
          </div>
        }
      </div>
    }
  </div>
</ng-template>

<ng-template #itemsGridCards let-title="title" let-items="items">
  <div class="section-destacados card-grid">
    <div class="title-container">
      <span class="explorar-text">{{'home.page.explore' | translate}}</span>
      <h2 class="section-title">{{'home.page.' + title | translate}}</h2>
    </div>
    @if (items) {
      <div class="section-grid container d-sm-flex">
        @for (item of items; track item) {
          <div class="card-item multi-row">
            <a [href]="item.href">
              <div class="card-header" [style.background-color]="item.color || defaultColor">
                <!-- Barra de color superior -->
              </div>
              <div class="card-body">
                <div class="img-container">
                  <img [src]="item.img" [alt]="item.title">
                </div>
                <div class="card-text">
                  <p>{{item.description}}</p>
                </div>
              </div>
            </a>
          </div>
        }
      </div>
    }
  </div>
</ng-template>
