<ds-truncatable [id]="label">
  <span *ngIf="length > 0">
    <sedici-truncatable-part
      [id]="label"
      [minLines]="minLines"
      [showCollapseButton]="false">
      <div>
        <h6 class="label">{{ label | translate }}</h6>
        <span [innerHTML]="metadataTextValue"></span>
      </div>
    </sedici-truncatable-part>
  </span>
</ds-truncatable>
