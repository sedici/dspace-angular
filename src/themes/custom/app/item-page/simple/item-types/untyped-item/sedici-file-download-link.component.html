<a [routerLink]="(bitstreamPath$ | async)?.routerLink" [queryParams]="(bitstreamPath$ | async)?.queryParams" [target]="isBlank ? '_blank' : '_self'" [ngClass]="cssClasses">
  <button class="download-btn">
    <ng-container *ngIf="(canDownload$ | async) !== true; else downloadIcon">
      <span role="img" [attr.aria-label]="'file-download-link.restricted' | translate" class="pr-1">
        <i class="fas fa-lock"></i>
      </span>
    </ng-container>
    <ng-template #downloadIcon>
      <span role="img" [attr.aria-label]="'file-download-link.download' | translate" class="pr-1">
        <i class="fas fa-download"></i>
      </span>
    </ng-template>
    Descargar
  </button>
</a>
