<ds-truncatable [id]="item?.id" class="container">
  <div *ngIf="availableLanguages.length > 1">
    <span *ngFor="let language of availableLanguages">
    <button (click)="changeLanguage(language)" [class.active]="language === selectedLanguage">
        {{ language }}
    </button>
    </span>
  </div>
  <ds-truncatable-part
    [id]="item?.id"
    [minLines]="4">
    <p class="abstract-text" [innerHTML]="getAbstract()"></p>
  </ds-truncatable-part>
</ds-truncatable>
