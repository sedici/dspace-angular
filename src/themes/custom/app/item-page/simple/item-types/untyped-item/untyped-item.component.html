<div>
  <div class="container">
    <div class="badge-title-container">
      <div class="badge-title-content">
        <div>
          <ds-sedici-context-badge *ngIf="showLabel" [object]="object" [showAccessStatus]="true"></ds-sedici-context-badge>
        </div>
        <h1 class="mr-auto">
          <ds-generic-item-page-field [item]="object"
            [fields]="['dc.title']">
          </ds-generic-item-page-field>
        </h1>
      </div>
      <ds-dso-edit-menu class="edit-menu"></ds-dso-edit-menu>
    </div>
    <div class="subtitle-container">
      <h4 class="subtitle-content mr-auto">
        <ds-generic-item-page-field [item]="object"
          [fields]="['sedici.title.subtitle']">
        </ds-generic-item-page-field>
      </h4>
    </div>
    <hr class="divider">
    <ds-generic-item-page-field [item]="object"
      [fields]="['sedici.creator.person']"
      [separator]="' | '">
    </ds-generic-item-page-field>
    <ds-generic-item-page-field [item]="object"
      [fields]="['sedici.creator.corporate']"
      [separator]="' | '"
      [label]="'sedici.item.page.sedici.creator.corporate'">
    </ds-generic-item-page-field>
    <ds-generic-item-page-field [item]="object"
      [fields]="['sedici.creator.interprete']"
      [separator]="' | '"
      [label]="'sedici.item.page.sedici.creator.interprete'">
    </ds-generic-item-page-field>
    <ds-generic-item-page-field [item]="object"
      [fields]="['sedici.contributor.compiler']"
      [separator]="' | '"
      [label]="'sedici.item.page.sedici.contributor.compiler'">
    </ds-generic-item-page-field>
    <ds-generic-item-page-field [item]="object"
      [fields]="['sedici.contributor.translator']"
      [separator]="' | '"
      [label]="'sedici.item.page.sedici.contributor.translator'">
    </ds-generic-item-page-field>
    <ds-generic-item-page-field [item]="object"
      [fields]="['sedici.contributor.editor']"
      [separator]="' | '"
      [label]="'sedici.item.page.sedici.contributor.editor'">
    </ds-generic-item-page-field>
    <ds-generic-item-page-field [item]="object"
      [fields]="['sedici.contributor.inscriber']"
      [separator]="' | '"
      [label]="'sedici.item.page.sedici.contributor.inscriber'">
    </ds-generic-item-page-field>
    <sedici-context [object]="object"></sedici-context>
    <div class="flex-container">
      <div class="item-identifiers">
        <ng-container *ngFor="let idValue of itemIdentifiers">
          <ds-badge-metadata-values
            [mdValues]="[idValue.mdValue]"
            [badgeType]="'badge-identifier'"
            [badgeLabelType]="'badge-primary'"
            [badgeLabel]="idValue.label"
            [copyToClipboardButton]="true"
            [url]="[idValue.url]">
          </ds-badge-metadata-values>
        </ng-container>
        <ds-badge-metadata-values
          [mdValues]="object?.allMetadata(['sedici.identifier.issn'])"
          [badgeType]="'badge-identifier'"
          [badgeLabelType]="'badge-primary'"
          [badgeLabel]="'ISSN'"
          [copyToClipboardButton]="true">
        </ds-badge-metadata-values>
        <ds-badge-metadata-values
          [mdValues]="object?.allMetadata(['sedici.identifier.isbn'])"
          [badgeType]="'badge-identifier'"
          [badgeLabelType]="'badge-primary'"
          [badgeLabel]="'ISBN'"
          [copyToClipboardButton]="true">
        </ds-badge-metadata-values>
      </div>
      <div class="botones-header">
        <button class="btn" (click)="openModalCitation()">
          <i class="fa-solid fa-quote-right"></i>
          <span class="d-none d-lg-inline"> Cómo citar</span>
        </button>
        <button class="btn" (click)="openModalShareButtons()">
          <i class="fa-solid fa-share"></i>
          <span class="d-none d-lg-inline"> Compartir</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="jumbotron">
  <div class="container">
    <div class="row">
      <!-- <div class="col-lg-3 col-md-12"> -->
        <!-- <lib-lrw-lareferencia
          [version]="'2.0.8'"
          [sampleIdentifierOAI]="'oai:bdigital.uexternado.edu.co'"
          [identifierHandle]="'/handle/[0-9.]+/([0-9]+)/?'"
          [nodoName]="'Colombia'"
          [repositoryName]="'Biblioteca Digital Universidad Externado de Colombia'"
          [contryCode]="'CO'"
          [nationalSource]="'62'"
          [repositorySource]="'4406'"
          [item]="object" >
        </lib-lrw-lareferencia> -->
      <!-- </div> -->

      <div class="col-12">
        <language-switcher [item]="object"></language-switcher>
        <app-expandable-metadata>
          <div class="d-flex flex-wrap responsive-columns">
            <div class="p-2 col-lg-4 col-md-12" [ngClass]="{'col-lg-12': !hasMetadata}">
              <ds-generic-item-page-field [item]="object"
                [fields]="['sedici.contributor.director']"
                [separator]="' | '"
                [label]="'sedici.item.page.sedici.contributor.director'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['sedici.contributor.codirector']"
                [separator]="' | '"
                [label]="'sedici.item.page.sedici.contributor.codirector'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['sedici.institucionDesarrollo']"
                [label]="'sedici.item.page.sedici.institucionDesarrollo'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['thesis.degree.name']"
                [label]="'sedici.item.page.thesis.degree.name'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['thesis.degree.grantor']"
                [label]="'sedici.item.page.thesis.degree.grantor'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['sedici.contributor.juror']"
                [separator]="' | '"
                [label]="'sedici.item.page.sedici.contributor.juror'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['dc.title.alternative']"
                [label]="'sedici.item.page.dc.title.alternative'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['sedici.contributor.colaborator']"
                [separator]="' | '"
                [label]="'sedici.item.page.sedici.contributor.colaborator'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['mods.originInfo.place']"
                [separator]="'; '"
                [label]="'sedici.item.page.mods.originInfo.place'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['dc.format.extent']"
                [label]="'sedici.item.page.dc.format.extent'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['dc.audience']"
                [label]="'sedici.item.page.dc.audience'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['dc.coverage.spatial']"
                [label]="'sedici.item.page.dc.coverage.spatial'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['dc.coverage.temporal']"
                [label]="'sedici.item.page.dc.coverage.temporal'">
              </ds-generic-item-page-field>
              <sedici-truncatable-generic-item-page-field [item]="object"
                [fields]="['dc.subject']"
                [label]="'sedici.item.page.dc.subject'"
                [minLines]="3">
              </sedici-truncatable-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['sedici.subject.materias']"
                [separator]="'; '"
                [label]="'sedici.item.page.sedici.subject.materias'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['dc.publisher']"
                [label]="subtype === ('Discurso' || 'Entrevista') ? ('sedici.item.page.dc.publisher.production') : ('sedici.item.page.dc.publisher.editorial')">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['dc.relation.ispartof']"
                [label]="'sedici.item.page.dc.relation.ispartof'">
              </ds-generic-item-page-field>
              <ds-item-page-uri-field [item]="object"
                [fields]="['sedici.identifier.uri']"
                [label]="'sedici.item.page.sedici.identifier.uri'">
              </ds-item-page-uri-field>
              <ds-item-page-uri-field [item]="object"
                [fields]="['sedici.relation.isRelatedWith']"
                [label]="'sedici.item.page.sedici.relation.isRelatedWith'">
              </ds-item-page-uri-field>
            </div>
            <div class="p-2 col-lg-8 col-md-12" *ngIf="hasMetadata">
              <ds-generic-item-page-field [item]="object"
                [fields]="['sedici.description.note']"
                [separator]="'<br/>'"
                [label]="'sedici.item.page.sedici.description.note'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['dc.format']"
                [separator]="'<br/>'"
                [label]="'sedici.item.page.dc.format'">
              </ds-generic-item-page-field>
              <ds-generic-item-page-field [item]="object"
                [fields]="['dc.format.medium']"
                [separator]="'<br/>'"
                [label]="'sedici.item.page.dc.format.medium'">
              </ds-generic-item-page-field>
            </div>
          </div>
        </app-expandable-metadata>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <ds-tabbed-content #tabbedContent [object]="object"></ds-tabbed-content>
</div>
