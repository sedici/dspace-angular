<ng-container *ngVar="(breadcrumbs$ | async) as breadcrumbs">
  <nav *ngIf="breadcrumbs && (showBreadcrumbs$ | async)" aria-label="breadcrumb" class="nav-breadcrumb">
    <ol class="container breadcrumb my-0">
      <ng-container *ngIf="breadcrumbs.length > 2 && isResponsive">
        <li class="breadcrumb-item">...</li>
        <ng-container *ngIf="breadcrumbs.length > 1">
          <ng-container *ngTemplateOutlet="breadcrumb; context: breadcrumbs[breadcrumbs.length - 2]"></ng-container>
        </ng-container>
      </ng-container>
      <ng-container *ngIf="!isResponsive">
        <ng-container *ngFor="let bc of breadcrumbs; let i = index; let last = last;">
          <ng-container *ngIf="!last && (i >= breadcrumbs.length - 3 || !isResponsive)">
            <ng-container *ngTemplateOutlet="breadcrumb; context: bc"></ng-container>
          </ng-container>
        </ng-container>
      </ng-container>
    </ol>
  </nav>

  <ng-template #breadcrumb let-text="text" let-url="url">
    <li class="breadcrumb-item">
      <div class="breadcrumb-item-limiter">
        <a [routerLink]="url" class="text-truncate" [ngbTooltip]="text | translate" placement="bottom">{{ text | translate }}</a>
      </div>
    </li>
  </ng-template>

  <ng-template #activeBreadcrumb let-text="text">
    <li class="breadcrumb-item active" aria-current="page">
      <div class="breadcrumb-item-limiter">
        <div class="text-truncate">{{ text | translate }}</div>
      </div>
    </li>
  </ng-template>
</ng-container>
