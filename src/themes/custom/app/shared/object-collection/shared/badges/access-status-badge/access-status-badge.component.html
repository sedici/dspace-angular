@if (showAccessStatus) {
  @if (accessStatus$ | async; as accessStatus) {
    <div class="access-status-container">
      <i class="fa-solid fa-circle" [class]="'status-icon ' + accessStatusClass"></i>
      <span [class]="'badge access-status-list-element-badge ' + accessStatusClass">
        {{ accessStatus | translate }}
      </span>
    </div>
  }
}
