<ds-status-badge [object]="object"></ds-status-badge>
@if (isMyDSpaceStatus) {
  <ds-my-dspace-status-badge [context]="context"></ds-my-dspace-status-badge>
}
<div class="badge-container">
  <ds-type-badge class="pe-1" [object]="object" [view]="'item-page'"></ds-type-badge>
  @if (showAccessStatus) {
    <ds-access-status-badge class="pe-1" [object]="object" [view]="'item'"></ds-access-status-badge>
  }
  <span class="year">{{ getYear() }}</span>
</div>
