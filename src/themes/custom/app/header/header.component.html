<header id="main-site-header" [ngClass]="((isMobile$ | async) !== true) || (isHomePage$ | async) ? 'white-header' : 'color-header'">
  <div class="d-flex align-items-center" id="main-site-header-container">
    <a *ngIf="(isMobile$ | async) !== true" class="navbar-brand p-2" routerLink="/home">
      <img id="header-logo" [src]="'assets/custom/images/SEDICI_2024.svg'" [attr.alt]="'menu.header.image.logo' | translate"/>
    </a>
    <ds-navbar *ngIf="(isMobile$ | async) !== true"></ds-navbar>
    <div *ngIf="(isMobile$ | async)" id="mobile-navbar-toggler" class="d-block d-lg-none">
      <button id="navbar-toggler" class="btn p-0 mx-2" type="button" (click)="toggleNavbar()"
              [attr.aria-label]="'nav.toggle' | translate" aria-controls="collapsible-mobile-navbar" 
              [attr.aria-expanded]="(isNavBarCollapsed$ | async) !== true">
        <span class="fas fa-bars fa-fw fa-xl toggler-icon" aria-hidden="true"></span>
      </button>
    </div>
    
    <div id="search-container" class="flex-grow-1">
      <ds-search-navbar *ngIf="((isMobile$ | async) && ((isHomePage$ | async) !== true)) || ((isMobile$ | async) !== true)"></ds-search-navbar>
      <a *ngIf="(isMobile$ | async) && (isHomePage$ | async)" routerLink="/home">
        <img id="header-logo" [src]="'assets/custom/images/SEDICI_2024.svg'" [attr.alt]="'menu.header.image.logo' | translate"/>
      </a>
    </div>
  </div>
</header>
