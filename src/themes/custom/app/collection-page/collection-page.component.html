<div class="container">
  <div class="collection-page"
    *ngVar="(collectionRD$ | async) as collectionRD">
    @if (collectionRD?.hasSucceeded) {
      <div @fadeInOut>
        @if (collectionRD?.payload; as collection) {
          <div>
            <div class="d-flex flex-row pb-4">
              <header class="comcol-header me-auto">
                <!-- Collection Name -->
                <ds-comcol-page-header
                    [name]="dsoNameService.getName(collection)">
                </ds-comcol-page-header>

                <div class="collection-logo-content-container">
                  <!-- Collection logo -->
                  @if (logoRD$ | async; as logoRD) {
                    @if (logoRD?.payload) {
                      <ds-comcol-page-logo [logo]="logoRD.payload" [alternateText]="'collection.logo' | translate">
                      </ds-comcol-page-logo>
                    }
                  }
                  
                  <div class="collection-text">
                    <!-- Introductory text -->
                    <ds-comcol-page-content [content]="collection.introductoryText" [hasInnerHtml]="true">
                    </ds-comcol-page-content>

                    <!-- Handle -->
                    <ds-comcol-page-handle
                        [content]="collection.handle"
                        [title]="'collection.page.handle'">
                    </ds-comcol-page-handle>
                  </div>
                </div>

                <!-- News -->
                <ds-comcol-page-content
                    [content]="collection.sidebarText"
                    [hasInnerHtml]="true"
                    [title]="'collection.page.news'">
                </ds-comcol-page-content>
              </header>
              <ds-dso-edit-menu></ds-dso-edit-menu>
            </div>

            <div class="pb-4">
              <img [src]="'assets/custom/images/detallegradiente.png'" alt="Gradiente">
            </div>

            <section class="comcol-page-browse-section">
              <!-- Browse-By Links -->
              <ds-comcol-page-browse-by
                [id]="collection.id"
                [contentType]="collection.type">
              </ds-comcol-page-browse-by>
              <router-outlet></router-outlet>
            </section>
            @if (collection.copyrightText) {
              <footer class="border-top my-5 pt-4">
                <!-- Copyright -->
                <ds-comcol-page-content
                  [content]="collection.copyrightText"
                  [hasInnerHtml]="true">
                </ds-comcol-page-content>
              </footer>
            }
          </div>
        }
      </div>
    }
    @if (collectionRD?.hasFailed) {
      <ds-error
      message="{{'error.collection' | translate}}"></ds-error>
    }
    @if (collectionRD?.isLoading) {
      <ds-loading
      message="{{'loading.collection' | translate}}"></ds-loading>
    }
  </div>
</div>
