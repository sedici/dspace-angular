<div class="custom-row">
  <div>
    @if (showLabel) {
      <ds-badges [object]="dso" [context]="context"></ds-badges>
    }
    @if (linkType !== linkTypes.None) {
      <a [target]="(linkType === linkTypes.ExternalLink) ? '_blank' : '_self'" [attr.rel]="(linkType === linkTypes.ExternalLink) ? 'noopener noreferrer' : null" [routerLink]="['/collections/' + dso.id]" class="item-list-title" [innerHTML]="dsoTitle"></a>
    }
    @if (linkType === linkTypes.None) {
      <span class="lead" [innerHTML]="dsoTitle"></span>
    }
    @if (dso.shortDescription) {
      <div class="collection-list-description" [innerHTML]="firstMetadataValue('dc.description.abstract')"></div>
    }
  </div>
</div>
