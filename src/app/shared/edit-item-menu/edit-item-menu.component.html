<div *ngIf="(isAuthenticated | async) && contextMenuObject" ngbDropdown #itemOptions="ngbDropdown" placement="bottom-right" class="d-inline-block float-right">
  <button class="btn btn-outline-primary" id="itemOptions" ngbDropdownToggle><i class="fas fa-ellipsis-v" aria-hidden="true"></i></button>
  <div id="itemOptionsDropdownMenu" aria-labelledby="itemOptions" ngbDropdownMenu>
    <h6 class="dropdown-header">{{'context-menu.actions.label' | translate}}</h6>
    <button ngbDropdownItem
          [routerLink]="['/edit-items', contextMenuObject.id,'form']">
    Editar como submission
  </button>
  </div>
</div>
