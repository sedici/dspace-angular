<div class="dropdown-container">
  <button class="btn btn-secondary" title="Opciones" aria-label="Opciones" (click)="toggleDropdown($event)">
    <span><i class="fa-solid fa-wand-magic-sparkles"></i></span>
  </button>

  <div #dropdown class="dropdown-menu">
    <div *ngFor="let option of options" (click)="applyFilter(option.id)" class="dropdown-item" [title]="option.description">
      <ng-container *ngIf="option.icon; else noIcon">
        <i [class]="option.icon"></i>
      </ng-container>
      <ng-template #noIcon>
        <span>{{ option.label }}</span>
      </ng-template>
    </div>
  </div>
</div>
